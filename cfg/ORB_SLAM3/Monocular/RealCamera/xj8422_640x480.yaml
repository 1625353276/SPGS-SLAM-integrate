%YAML:1.0

#--------------------------------------------------------------------------------------------
# XJ8422 lens + monocular USB camera (approximate intrinsics for 640x480)
#
# Source used:
#   Lens model: XJ8422
#   Sensor format: 1/2.7"
#   Focal length: 3.8 mm
#
# IMPORTANT:
#   This file is a usable first-pass estimate for lower-latency live capture.
#   For stable monocular SLAM and correct AR placement, calibrate the actual
#   camera + lens + chosen resolution with OpenCV and replace fx/fy/cx/cy/k1..k3.
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Approximate intrinsics downscaled from the previous 1280x720 estimate.
Camera1.fx: 453.0
Camera1.fy: 604.0
Camera1.cx: 320.0
Camera1.cy: 240.0

# Distortion is unknown from the lens datasheet.
# Set to zero for now; replace with calibrated values later.
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0
Camera1.k3: 0.0

# Camera frames per second
Camera.fps: 30

# Color order (0: BGR, 1: RGB)
Camera.RGB: 1

# Resolution
Camera.width: 640
Camera.height: 480

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 1
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# Force Local BA after skipping this many keyframes (0 to disable, default 0)
LocalMapping.maxSkipBA: 0

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
